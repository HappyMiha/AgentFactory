services:
  agent-factory:
    build:
      context: .
    image: agent-factory:local
    environment:
      AGENT_FACTORY_DB: /data/agent-factory.db
      AGENT_FACTORY_WORKSPACE: /workspace
    volumes:
      - agent-factory-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["demo"]

volumes:
  agent-factory-data:
