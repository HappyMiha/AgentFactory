name: agentfactory-temporal

services:
  postgresql:
    image: postgres:${POSTGRESQL_VERSION:-16.14-alpine3.24}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
      SQL_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - temporal-network
    entrypoint: ["/bin/sh"]
    command: ["/scripts/setup-postgres.sh"]
    restart: "no"

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.2}
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"
    networks:
      - temporal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 3600; done"]
    networks:
      - temporal-network
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.31.2}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-agentfactory}
      TEMPORAL_NAMESPACE_RETENTION: ${TEMPORAL_NAMESPACE_RETENTION:-7d}
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - temporal-network
    entrypoint: ["/bin/sh"]
    command: ["/scripts/create-namespace.sh"]
    restart: on-failure:5

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.53.0}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8765
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - temporal-network
    restart: unless-stopped

networks:
  temporal-network:
    name: agentfactory-temporal-network
    driver: bridge

volumes:
  temporal-postgresql-data:
    name: agentfactory-temporal-postgresql-data
